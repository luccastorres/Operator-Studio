<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" href="/favicon.png">
<title>Hub · Painel do mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Hanken+Grotesk:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#151412;--linen:#F3F1EC;--linen2:#EAE6DF;--card:#FBFAF7;--line:#D9D3C9;--taupe:#7E7669;--soft:#5F594F;--sand:#B5AEA2;--gold:#C9A36A;--ok:#4E6B4F;
--serif:'Tinos','Times New Roman',serif;--sans:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--linen);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.logo{font-family:var(--serif);font-size:21px}.logo b{font-weight:700}.logo i{color:var(--taupe)}
.ey{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.h1{font-family:var(--serif);font-size:34px;line-height:1.05}.h1 em{font-weight:400;color:var(--taupe)}
.h3{font-family:var(--serif);font-size:20px;line-height:1.15}
.muted{color:var(--soft)}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--taupe)}
textarea.in{min-height:90px;resize:vertical;line-height:1.5}
label.l{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);margin-bottom:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--linen);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:8px;align-items:end}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
.chip{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--linen2);color:var(--soft)}
.chip.ok{background:#E3EADF;color:var(--ok)}
.chip.wait{background:#F1E7D6;color:#8A6A3A}
.wk{display:flex;gap:6px;flex-wrap:wrap}
.wk button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--linen);font-family:var(--serif);font-size:16px}
.wk button.on{background:var(--ink);color:var(--linen);border-color:var(--ink)}
.err{color:#9A3B2E;font-size:14px}
header{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.hin{max-width:1100px;margin:0 auto}
.htop{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tab{flex:none;padding:10px 14px;font-size:14px;color:var(--soft);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 80px;display:flex;flex-direction:column;gap:14px}
.list>*{padding:10px 0;border-top:1px solid var(--line)}.list>*:first-child{border-top:0}
.day h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);font-weight:500;margin:6px 0 8px}
.sl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 6px 6px 0}
.sl.b{background:var(--ink);color:var(--linen);border-color:var(--ink)}
.sl button{font-size:12px;text-decoration:underline;opacity:.75}
.post{padding:10px 0;border-top:1px solid var(--line)}
.post b{font-size:13px}.post p{white-space:pre-wrap;font-size:14.5px;line-height:1.5;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--linen);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.wk button.auto{background:#E3EADF;border-color:#C9D6C4;color:var(--ok)}
.wk button.auto.on{background:var(--ink);color:var(--linen);border-color:var(--ink)}
/* full lesson reader */
.rd{max-width:760px}
.rd .back{display:flex;width:fit-content;margin-bottom:18px}
.rd .meta3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0 6px}
.rd .meta3 div{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.4;min-width:0}
@media(max-width:640px){.rd .meta3{grid-template-columns:1fr}}
.rd .toc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:14px 0 4px;scrollbar-width:none;position:sticky;top:calc(96px + env(safe-area-inset-top));background:var(--linen);z-index:2}
.rd .toc button{flex:none;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--soft)}
.rd section{padding-top:30px;scroll-margin-top:120px}
.rd section>h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin-bottom:14px}
.rd h3{font-size:17px;font-weight:600;line-height:1.35;margin:24px 0 8px}
.rd p,.rd li{font-size:15.5px;line-height:1.65}
.rd p{margin-bottom:12px}
.rd ul,.rd ol{padding-left:20px;margin-bottom:14px;display:flex;flex-direction:column;gap:5px}
.rd blockquote{border-left:2px solid var(--taupe);padding-left:14px;color:var(--soft);margin-bottom:14px}
.rd code{font-size:.9em;background:var(--linen2);padding:1px 5px;border-radius:5px}
.rd .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0 18px}
.rd table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
.rd th,.rd td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--line)}
.rd th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe);font-weight:500;background:var(--linen)}
.rd tr:last-child td{border-bottom:0}
.rd pre.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;margin-bottom:16px}
.rd .prompt{border:1px solid var(--ink);border-radius:14px;background:var(--card);margin:8px 0 12px;overflow:hidden}
.rd .prompt-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line);background:var(--linen)}
.rd .prompt-bar span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe)}
.rd .copy{background:var(--ink);color:var(--linen);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.rd .copy.done{background:var(--ok)}
.rd .prompt-text{margin:0;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
.rd .prompt.full .prompt-text{max-height:none}
.rd .more{display:block;width:100%;border-top:1px solid var(--line);padding:8px;font-size:13px;color:var(--soft);background:var(--card)}
.rd ul.checklist{list-style:none;padding:0;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.rd li.check{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.rd li.check:last-child{border-bottom:0}
.rd li.check input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);display:grid;place-content:center}
.rd li.check input:checked{background:var(--ink)}
.rd li.check input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--linen);border-bottom:2px solid var(--linen);transform:rotate(-45deg) translate(1px,-1px)}
.rd li.check input:checked+label{color:var(--soft);text-decoration:line-through}
.rd .prog-c{font-size:13px;color:var(--taupe);margin:-6px 0 10px}

/* ===== v2 ===== */
:root{--ink:#1C1A17;--linen:#F4F1EB;--linen2:#ECE6DD;--panel:#EFEAE2;--card:#FBF9F5;--line:#E0D9CE;--line2:#D3CABD;--taupe:#857B6E;--soft:#5F584F;--sand:#B7AEA1;--terra:#A65E40;--terra-d:#8E4D33;--terra-s:#F3E4DA;--ok:#5E7A5C;
--serif:'Fraunces','Tinos','Times New Roman',serif;--sh:0 1px 0 rgba(28,26,23,.02),0 10px 30px -18px rgba(60,45,30,.18)}
.logo{font-family:var(--serif);font-weight:400;font-size:23px}
.logo small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);margin-top:8px}
.h1{font-weight:400;font-size:40px;letter-spacing:-.02em;line-height:1.04}.h1 em{font-style:italic}
.h3{font-weight:400}
.btn{background:var(--terra);color:#FFF8F2;border-radius:12px}.btn:hover{background:var(--terra-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}.btn.ghost:hover{background:var(--card)}
.btn.sm{border-radius:10px}
.in{border-color:var(--line2);border-radius:12px}.in:focus{border-color:var(--terra)}
.card{border-color:var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh)}
.wk button.on,.wk button.auto.on{background:var(--terra);border-color:var(--terra)}
.sl.b{background:#2B2723;border-color:#2B2723}
.chip.ok{background:#E4EBE2;color:#3F5A40}
.tab.on{color:var(--ink);border-color:var(--terra)}
.side{display:none}
@media(min-width:1000px){
  #app:not([hidden]){display:grid;grid-template-columns:248px minmax(0,1fr);background:linear-gradient(to right,var(--panel) 248px,var(--linen) 248px);min-height:100vh}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:34px 18px 20px}
  .side .logo{padding:0 12px 30px}
  .side nav{display:flex;flex-direction:column;gap:3px}
  .side nav a,.side nav button{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;font-size:15px;color:var(--soft);text-decoration:none;position:relative;width:100%;text-align:left;border:0}
  .side nav svg{width:19px;height:19px;flex:none}
  .side nav a:hover,.side nav button:hover{background:rgba(255,255,255,.45)}
  .side nav button.on{background:var(--linen2);color:var(--ink)}
  .side nav button.on::before{content:'';position:absolute;left:-18px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--terra)}
  .side nav button.on svg{color:var(--terra)}
  .side .sep{height:1px;background:var(--line);margin:14px 10px}
  .side .sp{flex:1}
  .side .who{display:flex;align-items:center;gap:12px;padding:14px 10px 4px;border-top:1px solid var(--line)}
  .side .who b{display:block;font-weight:500;font-size:15px}.side .who span.r{font-size:13px;color:var(--taupe)}
  header{display:none}
  main{max-width:1180px;margin:0;padding:40px 44px 64px;gap:18px}
  .h1{font-size:54px}
}

/* ===== v2 pages ===== */
.av{border-radius:50%;background:var(--linen2);border:2px solid var(--card);display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--taupe);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}.av svg{width:55%;height:55%}
.avs{display:flex}.avs .av+.av{margin-left:-10px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.lead2{font-size:16px;line-height:1.55;margin-top:8px;max-width:640px}
.h2b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.12;letter-spacing:-.01em}
.btn.soft{background:var(--linen2);color:var(--ink)}.btn.soft:hover{background:#E3DBCF}
.btn svg{width:17px;height:17px}
.chip.terra{background:var(--terra-s);color:var(--terra-d)}
.lnk{color:var(--terra);font-size:13.5px;white-space:nowrap}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.ch h3{font-family:var(--serif);font-weight:400;font-size:21px;display:flex;align-items:center;gap:10px}
.ch h3 svg{width:19px;height:19px;color:var(--soft)}
.ch .num{font-family:var(--sans);font-size:12px;background:var(--terra);color:#fff;border-radius:999px;padding:2px 8px;font-weight:500}
.lst{display:flex;flex-direction:column}
.lst .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lst .li:first-child{border-top:0}
.lst .tx{flex:1;min-width:0}.lst .tx b{display:block;font-weight:500;font-size:15px}.lst .tx span{font-size:13px;color:var(--taupe)}
.lst .dt{width:46px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe);flex:none}.lst .dt b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:0}
.fstack{display:flex;flex-direction:column;gap:12px}
.hg2,.hg3,.hg2b,.acols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.hg2{grid-template-columns:2.2fr 1fr}.hg3{grid-template-columns:1fr 1fr 1fr}.hg2b{grid-template-columns:1fr 1fr}.acols{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.amain{display:flex;flex-direction:column;gap:16px;min-width:0}.aside2{display:flex;flex-direction:column;gap:16px}
.hero2{display:grid;gap:20px;background:#EFE9E0}
@media(min-width:760px){.hero2{grid-template-columns:1.4fr 1fr}.hero2 .hr{border-left:1px solid var(--line2);padding-left:22px}}
.hero2 .hl{display:flex;flex-direction:column;gap:10px}
.pill2{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--card);border:1px solid var(--line2);padding:6px 12px;border-radius:999px;width:fit-content}
.pill2 i{width:8px;height:8px;border-radius:50%;background:var(--terra)}
.meta2{display:flex;gap:16px;flex-wrap:wrap;font-size:14.5px;color:var(--soft)}.meta2 span{display:flex;align-items:center;gap:8px}.meta2 svg{width:17px;height:17px;color:var(--taupe)}
.quote{min-height:220px;background:#E8E1D7 center/cover;position:relative;padding:0;overflow:hidden}
.quote .hand{position:absolute;right:22px;top:22px;font-family:'Caveat',cursive;font-size:26px;line-height:1.1;color:#3B342C;transform:rotate(-6deg)}
.stats{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:12px}
.stats div{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;color:var(--soft)}.stats svg{width:17px;height:17px}.stats b{font-weight:600;color:var(--ink);min-width:24px}
.stars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stars button{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px}
.stars b{font-weight:500;font-size:15px}.stars span{font-size:12.5px;color:var(--taupe)}
/* students */
.stwrap{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1180px){.stwrap.on{grid-template-columns:minmax(0,1fr) 400px;align-items:start}}
.sgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.scard{gap:12px}.scard.sel{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra) inset,var(--sh)}
.scard .top{display:flex;gap:12px}.scard .top b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
.scard .top span{display:block;font-size:13.5px;color:var(--soft)}.scard .top span.c{color:var(--taupe);font-size:12.5px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--sand);background:var(--card)}
.dots i.o{border-color:var(--terra);color:var(--terra)}
.dots i.d{background:var(--terra);border-color:var(--terra);color:#fff}
.mini{display:flex;gap:10px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--line)}
.mini svg{width:18px;height:18px;color:var(--taupe);flex:none;margin-top:2px}
.mini span{display:block;font-size:12.5px;color:var(--taupe)}.mini b{font-weight:500;font-size:14px}
.mini.wait{background:var(--terra-s);border:0;border-radius:12px;padding:10px}
.spanel{padding:0;overflow:hidden;position:sticky;top:20px}
.spanel .cover{position:relative;height:220px;background:#D9CFC2}
.spanel .cover img{width:100%;height:100%;object-fit:cover}
.spanel .cover .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:80px;color:#fff}
.spanel .cover .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 16px;background:linear-gradient(transparent,rgba(28,26,23,.6));color:#fff}
.spanel .cover .ov b{display:block;font-family:var(--serif);font-weight:400;font-size:28px}
.spanel .cover .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:rgba(251,249,245,.92);font-size:20px}
.spanel .pb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.kv2{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--soft)}.kv2 div{display:flex;gap:10px;align-items:center}.kv2 svg{width:16px;height:16px;color:var(--taupe)}
/* aulas */
.nxt{padding:0;overflow:hidden;display:grid}
@media(min-width:760px){.nxt{grid-template-columns:280px 1fr}}
.nxt .im{background:center/cover;min-height:200px}
.nxt .bd{padding:22px;display:flex;flex-direction:column;gap:12px}
.prow{flex-direction:row;align-items:center;gap:16px;padding:12px}
.prow .th{width:130px;height:84px;border-radius:10px;overflow:hidden;flex:none;background:var(--linen2)}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow .tx{flex:1;min-width:0}.prow .tx b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;margin:3px 0}
@media(max-width:640px){.prow{flex-wrap:wrap}.prow .th{width:90px;height:60px}}
.seg3{display:flex;background:var(--linen2);border-radius:12px;padding:3px;gap:3px;margin:8px 0 14px}
.seg3 button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;color:var(--soft)}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* materiais */
.setup2{padding:0;overflow:hidden;display:grid;align-items:center}
@media(min-width:760px){.setup2{grid-template-columns:260px 1fr auto}}
.setup2 .im{height:150px}.setup2 .im img{width:100%;height:100%;object-fit:cover}
.setup2 .bd{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.mgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.mcard{padding:0;overflow:hidden;gap:0}
.mcard.wide{grid-column:1/-1}
.mcard .im{aspect-ratio:3/2;background:var(--linen2);min-height:0;overflow:hidden}.mcard.wide .im{aspect-ratio:auto;height:160px}
.mcard .im img{width:100%;height:100%;object-fit:cover}
.mcard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.mcard .h3{font-size:24px}

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
let KEY = store.get('os_crm_key')||'', S = null, TAB = location.hash.slice(1)||'inicio', OPEN = {}, INVITES = {}, PREV = null, CONTENT = {};
const TABS = [['inicio','Visão geral'],['alunos','Alunos'],['aulas','Aulas'],['materiais','Materiais'],['agenda','Agenda'],['comunidade','Comunidade']];
const TI = { inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>', alunos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4.5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V11"/></svg>', aulas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>', materiais:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>', agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>', comunidade:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4z"/></svg>' };
const KINDS = ['Aula','PDF','Vídeo','Template','Link'];

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2000); }
async function api(path, body){
  const r = await fetch('/api/hub/admin/'+path,{method:body?'POST':'GET',headers:{'x-crm-key':KEY,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const j = await r.json().catch(()=>({}));
  if(r.status===401){ logout(); throw new Error('auth'); }
  if(!r.ok){ const e=new Error(j.error||'api'); e.code=j.error; throw e; }
  return j;
}
const fDT = iso => new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
const fDay = iso => new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(new Date(iso));
const fT = iso => new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
const first = n => String(n||'').trim().split(/\s+/)[0];
function waNumber(raw){ let d=String(raw||'').replace(/[^\d+]/g,''); if(d.startsWith('+')) return d.slice(1); if(d.startsWith('00')) return d.slice(2); return d; }
const inviteUrl = t => `${location.origin}/hub/?convite=${t}`;
const inviteMsg = (s,t) => `Oi, ${first(s.nome)}! Bem-vindo à mentoria Operator Studio. Este é o seu Student Hub, onde ficam os materiais de cada semana, a agenda das sessões e a comunidade dos alunos. Crie sua senha por aqui: ${inviteUrl(t)}`;

async function load(){ const [st, mp] = await Promise.all([api('state'), api('mentor').catch(()=>({}))]); S = { ...st, mentorPhoto: mp.photo||'' }; render(); }
function render(){
  $('#tabs').innerHTML = TABS.map(([k,t])=>`<button class="tab ${k===TAB?'on':''}" data-tab="${k}">${t}</button>`).join('');
  $('#stabs').innerHTML = TABS.map(([k,t])=>`<button class="${k===TAB?'on':''}" data-tab="${k}">${TI[k]}${t}</button>`).join('');
  $('#meAv').innerHTML = `<span style="width:44px;height:44px;border-radius:50%;overflow:hidden;background:#ECE6DD;display:inline-flex;align-items:center;justify-content:center;font-family:Fraunces,Tinos,serif;font-size:18px;color:#857B6E">${S.mentorPhoto?`<img src="${esc(S.mentorPhoto)}" alt="" style="width:100%;height:100%;object-fit:cover">`:'L'}</span>`;
  const m=$('#main');
  m.innerHTML = TAB==='inicio'?vHome():TAB==='aulas'?vAulas():TAB==='materiais'?(PREV!==null?vPreview(PREV):vMat()):TAB==='agenda'?vAgenda():TAB==='comunidade'?vForum():vStudents();
  bind();
}
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(t){ TAB=t.dataset.tab; PREV=null; history.replaceState(null,'','#'+TAB); render(); } });

function extraEditor(s){
  const ex = s.extra||{};
  return `<div class="card" style="background:var(--linen)" data-exed="${esc(s.id)}"><span class="ey">Links individuais por semana · só ${esc(first(s.nome))} vê</span>
    ${[1,2,3,4,5,6,7,8].map(w=>`<div><label class="l">Semana ${w}</label><textarea class="in" style="min-height:52px" data-exw="${w}" placeholder="Uma linha por link: Título | https://...">${esc((ex[w]||[]).map(i=>i.label+' | '+i.url).join('\n'))}</textarea></div>`).join('')}
    <div><button class="btn sm" data-exsave="${esc(s.id)}">Salvar links</button></div></div>`;
}

/* ---------- materials ---------- */
function contentLine(m){ return m.content ? `<div class="row"><span class="chip ok">Aula completa · ${m.steps} passos · ${m.prompts} prompts</span>${m.pdf?'<span class="chip ok">PDF</span>':''}</div>` : ''; }
function contentBtns(m){ return m.content ? `<button class="btn sm" data-prev="${m.week}">Ver aula</button>${m.pdf?`<a class="btn ghost sm" href="${esc(m.pdf)}" target="_blank" rel="noopener">PDF</a>`:''}` : ''; }
const HF = 'https://d8j0ntlcm91z4.cloudfront.net/user_3DMJVscwQvFTrMP11mO9Sz1Jsdw/';
const SRC = { setup:'hf_20261020_211552_59ec0a41-59ce-4447-a9d1-797f6a7f4703', w1:'hf_20261020_211645_d639074d-2289-400d-9047-10744776ac86', w2:'hf_20261020_211644_e9a24ec1-48b9-4be6-8511-96ef55fcf227', w3:'hf_20261020_211646_ee58139d-e357-4c1e-a19a-28b63480bbee', w4:'hf_20261020_211645_57f4077d-c510-423e-a61f-f42f378153b4', w5:'hf_20261020_211644_88f377ef-9597-432b-83c5-73b65936bf9a', w6:'hf_20261020_211645_b75447d1-9419-49b4-a2e7-6ae82022f375', w7:'hf_20261020_211646_d71087c3-0148-4ea5-babb-5c5396028486', w8:'hf_20261020_211644_38d35765-97f1-4c9d-a045-2869c15d7124', mug:'hf_20261020_211643_44851e6b-8158-4e8d-8cf1-cb1708c65068', cups:'hf_20261020_211646_751dce11-c4c0-475d-8af4-ac564ab7d1e6' };
const img = (k, w=400) => { const u = HF+SRC[k]+'.png'; return /^(localhost|127\.)/.test(location.hostname) ? u : `/.netlify/images?url=${encodeURIComponent(u)}&w=${w}&fm=webp&q=72`; };
const thumb = k => SRC[k] ? `<span style="width:92px;height:62px;border-radius:10px;overflow:hidden;flex:none;background:#ECE6DD"><img src="${img(k,240)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"></span>` : '';
const itemRow = i => `<div class="g3" style="margin-bottom:8px"><div><label class="l">Título</label><input class="in" data-i="label" value="${esc(i.label||'')}"></div><div><label class="l">Link</label><input class="in" data-i="url" value="${esc(i.url||'')}"></div><div><label class="l">Tipo</label><select class="in" data-i="kind">${KINDS.map(k=>`<option ${i.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><button class="btn ghost sm" data-rmitem>×</button></div>`;

/* ---------- lesson preview ---------- */
function vPreview(n){
  const c = CONTENT[n]; const back = `<button class="btn ghost sm back" data-prevback>← Materiais</button>`;
  if(!c) return `<div class="rd">${back}<p class="muted">Carregando…</p></div>`;
  const m = c.meta||{};
  return `<div class="rd">${back}<span class="ey">Prévia do aluno · Semana ${String(c.week).padStart(2,'0')}</span><h1 class="h1" style="margin-top:8px">${esc(c.title)}</h1>
    <p class="muted" style="font-size:17px;line-height:1.5;margin-top:12px">${esc(c.lead||'')}</p>
    <div class="meta3"><div><span class="ey">Entrega</span>${esc(m['Entrega no ar']||'')}</div><div><span class="ey">Ferramentas</span>${esc(m['Ferramentas']||'')}</div><div><span class="ey">Tempo</span>${esc(m['Tempo da tarefa da semana']||'')}</div></div>
    ${c.pdf?`<div class="row" style="margin-top:12px"><a class="btn sm" href="${esc(c.pdf)}" target="_blank" rel="noopener">Abrir PDF</a></div>`:''}
    <nav class="toc">${c.sections.map(s=>`<button data-toc="${esc(s.slug)}">${esc(s.short)}</button>`).join('')}</nav>
    ${c.sections.map(s=>`<section id="sec-${esc(s.slug)}"><h2>${esc(s.name)}</h2>${s.html}</section>`).join('')}
    <div class="row" style="margin-top:28px">${back}</div></div>`;
}
async function openPrev(n){ PREV=n; render(); window.scrollTo(0,0); if(!CONTENT[n]){ try{ const r=await fetch('/api/hub/admin/content?w='+n,{headers:{'x-crm-key':KEY},cache:'no-store'}); const j=await r.json(); CONTENT[n]=j.content; }catch{ toast('Erro ao carregar'); PREV=null; } render(); } }
function bindPrev(){
  const rd=document.querySelector('.rd'); if(!rd) return;
  rd.querySelectorAll('[data-prevback]').forEach(b=>b.onclick=()=>{ PREV=null; render(); window.scrollTo(0,0); });
  rd.querySelectorAll('[data-toc]').forEach(b=>b.onclick=()=>{ const el=document.getElementById('sec-'+b.dataset.toc); if(el) el.scrollIntoView({behavior:'smooth'}); });
  rd.querySelectorAll('.prompt').forEach(p=>{ const pre=p.querySelector('.prompt-text'), btn=p.querySelector('.copy');
    btn.onclick=async()=>{ try{ await navigator.clipboard.writeText(pre.textContent); btn.textContent='Copiado'; btn.classList.add('done'); setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('done');},1800); }catch{ toast('Não foi possível copiar'); } }; });
}

const IC = (()=>{ const S = (d,w=1.6) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}">${d}</svg>`; return {
  cal:S('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'), video:S('<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>'),
  group:S('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.5 4.4 1 5 3.8"/>'),
  user:S('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/>'), mail:S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  plus:S('<path d="M12 5v14M5 12h14"/>'), phone:S('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),
  pin:S('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'), link:S('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
  clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), edit:S('<path d="M4 20h4L19 9l-4-4L4 16z"/>'), eye:S('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  heart:S('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'), chat:S('<path d="M4 5h16v11H9l-5 4z"/>'), home:S('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>') }; })();
/* ---------- v2 helpers ---------- */
const stuPhoto = s => s && s.photoAt ? `/api/hub/avatar/${encodeURIComponent(s.id)}?v=${encodeURIComponent(s.photoAt)}` : '';
function av(p, n=40, sq){ const ph = p && (p.photo || stuPhoto(p)); return `<span class="av" style="width:${n}px;height:${n}px;font-size:${Math.round(n*.4)}px;${sq?'border-radius:14px;':''}">${ph?`<img src="${esc(ph)}" alt="">`:esc(first(p&&p.nome||'?').charAt(0).toUpperCase())}</span>`; }
const mentorP = () => ({ nome:'Luccas', photo:S.mentorPhoto||'' });
const stu = id => S.students.find(x=>x.id===id);
const pairIds = s => [s.id, s.partnerId].filter(Boolean);
const endT = x => new Date(x.start).getTime() + (x.dur||90)*60000;
function progress(s){
  const mine = S.slots.filter(x=>pairIds(s).includes(x.studentId));
  const done = new Set(mine.filter(x=>x.week && endT(x) < Date.now()).map(x=>x.week));
  const open = new Set([...(s.released||[]), ...mine.filter(x=>x.week && new Date(x.start).getTime() <= Date.now()+15*60000).map(x=>x.week)]);
  const next = mine.filter(x=>endT(x) > Date.now()).sort((a,b)=>a.start.localeCompare(b.start))[0];
  return { done, open, next, n: done.size, pct: Math.round(done.size/8*100) };
}

/* ---------- agenda ---------- */
let AGW = 0, AGV = 'sem', AGM = 0;
function vAgenda(){
  const today = new Date(); const mon0 = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay()+6)%7));
  const mon = new Date(mon0.getFullYear(), mon0.getMonth(), mon0.getDate() + AGW*7);
  const days = [...Array(7)].map((_,i)=>new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i));
  const k = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dk = iso => new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date(iso));
  const hm = iso => { const p = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)); return [+p.slice(0,2), +p.slice(3)]; };
  const ev = [...S.slots.map(x=>({ ...x, kind: x.studentId?'s':'free' })), ...(S.groups||[]).map(g=>({ ...g, kind:'g' }))];
  const by = {}; ev.forEach(e=>{ (by[dk(e.start)] = by[dk(e.start)]||[]).push(e); }); Object.values(by).forEach(l=>l.sort((x,y)=>x.start.localeCompare(y.start)));
  const nameOf = e => e.kind==='g' ? (e.title||'Aula em grupo') : (peopleNames(pairIds(stu(e.studentId)||{id:e.studentId}).map(stu).filter(Boolean))||'Aluno');
  const future = e => new Date(e.start) > Date.now();
  // month grid
  const m1 = new Date(today.getFullYear(), today.getMonth()+AGM, 1), mEnd = new Date(m1.getFullYear(), m1.getMonth()+1, 1);
  const gStart = new Date(m1.getFullYear(), m1.getMonth(), 1 - ((m1.getDay()+6)%7));
  const nW = Math.ceil(((mEnd - gStart)/864e5)/7);
  const mdays = [...Array(nW*7)].map((_,i)=>new Date(gStart.getFullYear(), gStart.getMonth(), gStart.getDate()+i));
  const MONTH = AGV==='mes';
  const pDays = MONTH ? mdays.filter(d=>d.getMonth()===m1.getMonth()) : days;
  const pKeys = new Set(pDays.map(k));
  const freeP = ev.filter(e=>e.kind==='free' && future(e) && pKeys.has(dk(e.start))).sort((x,y)=>x.start.localeCompare(y.start));
  let h0 = 9, h1 = 19; days.forEach(d=>(by[k(d)]||[]).forEach(e=>{ const [h] = hm(e.start); h0 = Math.min(h0, h); h1 = Math.max(h1, Math.min(24, h+2)); }));
  const PX = 52, hrs = [...Array(h1-h0)].map((_,i)=>h0+i), DOWL = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const evHtml = e => { const [h,m] = hm(e.start), top = ((h-h0)*60+m)/60*PX, ht = Math.max(26,(e.dur||90)/60*PX-3);
    if(e.kind==='free') return `<div class="tev free" style="top:${top}px;height:${ht}px"><b>${fT(e.start)}</b> <span class="fl">Livre</span>${future(e)?`<button data-rm="${esc(e.start)}" title="Remover horário" aria-label="Remover horário">×</button>`:''}</div>`;
    if(e.kind==='g') return `<a class="tev grp" style="top:${top}px;height:${ht}px" href="/aula/?s=${encodeURIComponent(e.start)}&m=1" target="_blank" rel="noopener">${IC.group}<b>${esc(e.title)}</b><span>${fT(e.start)} – ${fT(new Date(endT(e)).toISOString())}</span></a>`;
    const s = stu(e.studentId); return `<div class="tev ind" style="top:${top}px;height:${ht}px">${av(s||{nome:'?'},26)}<div><b>${esc(nameOf(e))}</b><span>S${e.week||''} · ${fT(e.start)}</span><span class="acts3">${S.live?`<a href="/aula/?s=${encodeURIComponent(e.start)}&m=1" target="_blank" rel="noopener">sala</a>`:''}${future(e)?`<button data-acancel="${esc(e.start)}">desmarcar</button>`:''}</span></div></div>`; };
  const rowHtml = e => `<div class="li">${e.kind==='free'?`<span class="av fr" style="width:38px;height:38px">${IC.clock}</span>`:e.kind==='g'?`<span class="av" style="width:38px;height:38px">${IC.group}</span>`:av(stu(e.studentId)||{nome:'?'},38)}<div class="tx"><b>${e.kind==='free'?'Horário livre':esc(nameOf(e))}</b><span>${fT(e.start)}${e.kind==='s'&&e.week?` · Semana ${e.week}`:''}</span></div>${e.kind==='free'&&future(e)?`<button class="btn ghost sm" data-rm="${esc(e.start)}">Remover</button>`:e.kind==='s'&&future(e)?`<button class="btn ghost sm" data-acancel="${esc(e.start)}">Desmarcar</button>`:e.kind==='g'?`<a class="btn ghost sm" href="/aula/?s=${encodeURIComponent(e.start)}&m=1" target="_blank" rel="noopener">Sala</a>`:''}</div>`;
  const dayLbl = d => cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'}).replace('.',''));
  const mlabel = cap(m1.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const wlabel = `${days[0].getDate()} ${days[0].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')} – ${days[6].getDate()} ${days[6].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}`;
  const nav = MONTH
    ? `<button class="btn ghost sm" data-agm="-1" aria-label="Mês anterior">←</button><span class="btn ghost sm" style="pointer-events:none">${mlabel}</span><button class="btn ghost sm" data-agm="1" aria-label="Próximo mês">→</button>${AGM?'<button class="btn ghost sm" data-agm="0">Hoje</button>':''}`
    : `<button class="btn ghost sm" data-agw="-1" aria-label="Semana anterior">←</button><span class="btn ghost sm" style="pointer-events:none">${wlabel}</span><button class="btn ghost sm" data-agw="1" aria-label="Próxima semana">→</button>${AGW?'<button class="btn ghost sm" data-agw="0">Hoje</button>':''}`;
  const weekGrid = `<div class="card tgrid" style="padding:0">
      <div class="gh"></div>${days.map((d,i)=>`<div class="gh ${k(d)===k(today)?'td':''}">${DOWL[i]}<b>${d.getDate()}</b></div>`).join('')}
      <div class="ghrs" style="height:${hrs.length*PX}px">${hrs.map((h,i)=>i?`<span style="top:${i*PX}px">${String(h).padStart(2,'0')}:00</span>`:'').join('')}</div>
      ${days.map(d=>`<div class="gcol ${k(d)===k(today)?'td':''}" style="height:${hrs.length*PX}px;background-size:100% ${PX}px">${(by[k(d)]||[]).map(evHtml).join('')}</div>`).join('')}
    </div>
    <div class="card aglist">${days.map(d=>{ const l=by[k(d)]||[]; return `<div class="agd ${k(d)===k(today)?'td':''}"><p class="agh">${dayLbl(d)}</p>${l.length?`<div class="lst">${l.map(rowHtml).join('')}</div>`:'<p class="muted" style="font-size:13.5px">Nada neste dia.</p>'}</div>`; }).join('')}</div>`;
  const monthGrid = `<div class="card mgrid2" style="padding:0">${DOWL.map(d=>`<div class="mh">${d}</div>`).join('')}${mdays.map(d=>{ const l=by[k(d)]||[], out=d.getMonth()!==m1.getMonth(); const busy=l.filter(e=>e.kind!=='free'), fr=l.filter(e=>e.kind==='free'&&future(e)).length;
      return `<button type="button" class="mc ${out?'out':''} ${k(d)===k(today)?'td':''}" data-agday="${k(d)}"><b>${d.getDate()}</b>${busy.slice(0,3).map(e=>`<span class="mchip ${e.kind==='g'?'g':'s'}">${fT(e.start)} ${esc(nameOf(e).split(' ')[0])}</span>`).join('')}${busy.length>3?`<span class="mmore">+${busy.length-3}</span>`:''}${fr?`<span class="mfree">${fr} livre${fr>1?'s':''}</span>`:''}<i class="mdots">${busy.map(e=>`<em class="${e.kind==='g'?'g':'s'}"></em>`).join('')}${fr?'<em class="f"></em>':''}</i></button>`; }).join('')}</div>
    <p class="muted" style="font-size:13px">Toque num dia para abrir a semana.</p>`;
  return `${head('Agenda','O ritmo <em>da mentoria.</em>',`Você abre os horários e cada aluno escolhe o seu. Horários no seu fuso: ${esc(TZ.split('/').pop().replace(/_/g,' '))}.`)}
  <div class="acols"><div class="amain">
    <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="row" style="flex-wrap:wrap">${nav}</div>
      <div class="row" style="gap:12px;flex-wrap:wrap"><div class="agseg"><button class="${MONTH?'':'on'}" data-agv="sem">Semana</button><button class="${MONTH?'on':''}" data-agv="mes">Mês</button></div>
      <div class="legend2"><span><i style="background:var(--terra)"></i>Individual</span><span><i style="background:#D9CFC2"></i>Grupo</span><span><i style="border:1px dashed var(--sand)"></i>Livre</span></div></div></div>
    ${MONTH ? monthGrid : weekGrid}
  </div>
  <div class="aside2">
    <div class="card"><div class="ch" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Horários livres</h3>${freeP.length>1?`<button class="btn ghost sm" data-rmall="${esc(freeP.map(e=>e.start).join(','))}">Remover todos</button>`:''}</div>
      <p class="muted" style="font-size:13px;margin:-4px 0 6px">${MONTH?'Em '+esc(mlabel.toLowerCase()):'Nesta semana'} · ${freeP.length} ${freeP.length===1?'horário':'horários'}. Só horários sem aluno podem ser removidos.</p>
      ${freeP.length?`<div class="lst frl">${freeP.map(e=>`<div class="li"><div class="tx"><b>${esc(cap(new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'}).format(new Date(e.start))).replace('.',''))}</b><span>${fT(e.start)}</span></div><button class="btn ghost sm" data-rm="${esc(e.start)}">Remover</button></div>`).join('')}</div>`:'<p class="muted" style="font-size:14px">Nenhum horário livre neste período.</p>'}
    </div>
    <form class="card fstack" id="fSlots"><div class="ch" style="margin:0"><h3>${IC.clock}Abrir horários</h3></div>
      <div><label class="l">A partir do dia</label><input class="in" type="date" name="date" required></div>
      <div><label class="l">Horários (separados por vírgula)</label><input class="in" name="times" placeholder="10:00, 14:00, 16:00" required></div>
      <div><label class="l">Dias da semana</label><div class="wk" id="dows">${['D','S','T','Q','Q','S','S'].map((d,i)=>`<button type="button" data-dow="${i}" class="${[1,2,3,4,5].includes(i)?'on':''}">${d}</button>`).join('')}</div></div>
      <div><label class="l">Por quantas semanas</label><select class="in" name="weeks">${[1,2,3,4,6,8].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></div>
      <button class="btn" type="submit">Abrir horários</button></form>
  </div></div>`;
}

      <div class="row" style="justify-content:space-between"><select class="in" name="topic" style="max-width:220px">${['Avisos','Geral','IA e prompts','Marca','Website','Conteúdo','Vendas e CRM','Automações','Agentes','Vitórias'].map(t=>`<option>${t}</option>`).join('')}</select><button class="btn" type="submit">${IC.plus}Publicar</button></div></div></div></form>

        <h3 class="h2b" style="font-size:24px">${esc(t.title)}</h3><p class="ex ${open?'full':''}">${esc(t.body)}</p>

        ${open?`<div>${t.replies.map(r=>`<div class="rep">${av(who(r.authorId,r.author),34)}<div style="flex:1"><b>${esc(r.author)}</b> <span class="muted" style="font-size:12.5px">· ${esc(agoS(r.createdAt))}</span> <button class="muted" style="font-size:12px;text-decoration:underline" data-delr="${esc(t.id)}|${esc(r.id)}">apagar</button><p ${r.mentor?'class="mt"':''}>${esc(r.body)}</p></div></div>`).join('')}
          <form data-reply="${esc(t.id)}" class="fstack" style="margin-top:10px"><textarea class="in" name="body" placeholder="Responder como mentor…" required style="min-height:70px"></textarea><div><button class="btn sm" type="submit">Responder</button></div></form></div>`:''}</div>`; }).join('') : '<p class="muted">Ainda sem conversas. Comece com um aviso de boas-vindas.</p>'}
  </div>
  <div class="aside2">
    <div class="card"><div class="ch"><h3>Membros do Studio</h3><span class="muted" style="font-size:13px">${S.students.filter(s=>s.active).length+1}</span></div>
      <div class="lst">${[mentorP(), ...S.students.filter(s=>s.active)].map((p,i)=>`<div class="li">${av(p,40)}<div class="tx"><b>${esc(p.nome)}</b><span>${i?esc(p.negocio||'Aluno'):'Mentor'}</span></div></div>`).join('')}</div></div>

/* ---------- bind ---------- */
function bind(){
  document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>openPrev(+b.dataset.prev));
  document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ SEL = b.dataset.sel || null; if(TAB!=='alunos'){ TAB='alunos'; history.replaceState(null,'','#alunos'); } render(); if(SEL && innerWidth<1100){ const pn=document.querySelector('.spanel'); if(pn) pn.scrollIntoView({behavior:'smooth'}); } });
  document.querySelectorAll('[data-amode]').forEach(b=>b.onclick=()=>{ AMODE=b.dataset.amode; render(); });
  document.querySelectorAll('[data-agw]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.agw; AGW = v ? AGW+v : 0; render(); });
  document.querySelectorAll('[data-agm]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.agm; AGM = v ? AGM+v : 0; render(); });
  document.querySelectorAll('[data-agv]').forEach(b=>b.onclick=()=>{ AGV=b.dataset.agv; render(); });
  document.querySelectorAll('[data-agday]').forEach(b=>b.onclick=()=>{ const [y,m,d]=b.dataset.agday.split('-').map(Number); const t=new Date(); const m0=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)); const dd=new Date(y,m-1,d); const md=new Date(y,m-1,d-((dd.getDay()+6)%7)); AGW=Math.round((md-m0)/(7*864e5)); AGV='sem'; render(); });
  document.querySelectorAll('[data-rmall]').forEach(b=>b.onclick=async()=>{ const list=b.dataset.rmall.split(',').filter(Boolean); if(!confirm(`Remover ${list.length} horários livres? Sessões já marcadas não são afetadas.`)) return; try{ await api('slots',{remove:list}); await load(); toast(`${list.length} horários removidos`); }catch{ toast('Erro'); } });
  bindPrev();
  const fn=$('#fNew'); if(fn) fn.onsubmit=async e=>{ e.preventDefault(); try{ const r=await api('student',Object.fromEntries(new FormData(fn))); INVITES[r.student.id]=r.invite; await load(); toast('Aluno criado'); }catch(x){ toast(x.code==='exists'?'Esse e-mail já existe':'Preencha nome e e-mail'); } };
  document.querySelectorAll('[data-rel]').forEach(box=>box.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{
    const s=S.students.find(x=>x.id===box.dataset.rel); const w=+b.dataset.w; const set=new Set(s.released||[]); set.has(w)?set.delete(w):set.add(w); s.released=[...set].sort((a,b)=>a-b); b.classList.toggle('on');
    try{ await api('student',{id:s.id,released:s.released}); toast(set.has(w)?`Semana ${w} liberada`:`Semana ${w} bloqueada`); }catch{ toast('Erro'); } }));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast('Link copiado'); }catch{ prompt('Copie:',b.dataset.copy); } });
  document.querySelectorAll('[data-viewas]').forEach(b=>b.onclick=async()=>{ const w=window.open('about:blank','_blank'); try{ const r=await api('view-as',{id:b.dataset.viewas}); w.location='/hub/#sessao='+r.token; }catch{ if(w) w.close(); toast('Erro'); } });
  document.querySelectorAll('[data-reinv]').forEach(b=>b.onclick=async()=>{ try{ const r=await api('reinvite',{id:b.dataset.reinv}); INVITES[b.dataset.reinv]=r.invite; render(); }catch{ toast('Erro'); } });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const s=S.students.find(x=>x.id===b.dataset.del); if(!confirm(`Remover ${s.nome} do hub? As sessões marcadas voltam a ficar livres.`)) return; try{ await api('student-delete',{id:s.id}); await load(); toast('Aluno removido'); }catch{ toast('Erro'); } });
  document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{ OPEN['x'+b.dataset.extra]=!OPEN['x'+b.dataset.extra]; render(); });
  document.querySelectorAll('[data-exsave]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.exsave, box=document.querySelector(`[data-exed="${CSS.escape(id)}"]`); const extra={};

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ OPEN[b.dataset.open]=!OPEN[b.dataset.open]; render(); });
  document.querySelectorAll('[data-additem]').forEach(b=>b.onclick=()=>b.closest('[data-mat]').querySelector('[data-items]').insertAdjacentHTML('beforeend',itemRow({kind:'Link'})));
  document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; if(f.size>5.5*1024*1024){ toast('Arquivo maior que 5 MB: use um link do Drive'); return; }
    toast('Enviando…'); const r=await fetch('/api/hub/admin/upload?name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-crm-key':KEY,'content-type':f.type||'application/octet-stream'},body:f}); const j=await r.json().catch(()=>({}));
    if(!r.ok){ toast('Erro no envio'); return; } inp.closest('[data-mat]').querySelector('[data-items]').insertAdjacentHTML('beforeend',itemRow({label:f.name.replace(/\.[^.]+$/,''),url:j.url,kind:/pdf/i.test(f.type)?'PDF':'Template'})); toast('Arquivo enviado: salve a semana'); inp.value=''; });
  document.querySelectorAll('[data-savemat]').forEach(b=>b.onclick=async()=>{ const box=b.closest('[data-mat]'); const v=k=>box.querySelector(`[data-f="${k}"]`).value;
    const items=[...box.querySelectorAll('[data-items]>.g3')].map(r=>({label:r.querySelector('[data-i=label]').value,url:r.querySelector('[data-i=url]').value,kind:r.querySelector('[data-i=kind]').value}));
    try{ await api('material',{week:+b.dataset.savemat,title:v('title'),summary:v('summary'),body:v('body'),items}); await load(); toast('Semana salva'); }catch{ toast('Erro ao salvar'); } });
  const fs=$('#fSlots'); if(fs){
    fs.querySelectorAll('[data-dow]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    fs.onsubmit=async e=>{ e.preventDefault(); const fd=new FormData(fs); const dows=[...fs.querySelectorAll('[data-dow].on')].map(b=>+b.dataset.dow);
      const times=String(fd.get('times')).split(/[,\s]+/).filter(t=>/^\d{1,2}:\d{2}$/.test(t)); const [y,mo,d]=String(fd.get('date')).split('-').map(Number); const n=+fd.get('weeks')*7; const add=[];
      for(let i=0;i<n;i++){ const day=new Date(y,mo-1,d+i); if(!dows.includes(day.getDay())) continue; for(const t of times){ const [h,mi]=t.split(':').map(Number); const dt=new Date(y,mo-1,d+i,h,mi); if(dt>new Date()) add.push(dt.toISOString()); } }
      if(!add.length){ toast('Nenhum horário gerado'); return; }
      try{ const r=await api('slots',{add}); await load(); toast(`${r.added} horários abertos`); }catch{ toast('Erro'); } };
  }
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async(ev)=>{ ev.stopPropagation(); b.disabled=true; try{ await api('slots',{remove:[b.dataset.rm]}); await load(); toast('Horário removido'); }catch{ b.disabled=false; toast('Erro'); } });
  document.querySelectorAll('[data-acancel]').forEach(b=>b.onclick=async()=>{ if(!confirm('Desmarcar esta sessão? O aluno recebe um e-mail para escolher outro horário.')) return; try{ await api('slot-cancel',{start:b.dataset.acancel}); await load(); toast('Sessão desmarcada'); }catch{ toast('Erro'); } });
  const fg=$('#fGroup'); if(fg){
    fg.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{ const on=fg.querySelectorAll('[data-gs].on').length; if(!b.classList.contains('on') && on>=3){ toast('Até 3 alunos por aula'); return; } b.classList.toggle('on'); b.style.background=b.classList.contains('on')?'#151412':''; b.style.color=b.classList.contains('on')?'#F3F1EC':''; });
    fg.onsubmit=async e=>{ e.preventDefault(); const fd=new FormData(fg); const ids=[...fg.querySelectorAll('[data-gs].on')].map(b=>b.dataset.gs);
      if(!ids.length){ toast('Escolha os alunos'); return; }
      const [y,mo,d]=String(fd.get('date')).split('-').map(Number), [h,mi]=String(fd.get('time')).split(':').map(Number);
      const dt=new Date(y,mo-1,d,h,mi); if(!(dt>new Date())){ toast('Escolha um horário futuro'); return; }
      try{ await api('group',{start:dt.toISOString(),title:fd.get('title'),dur:+fd.get('dur')||90,studentIds:ids,notify:!!fd.get('notify')}); await load(); toast('Aula em grupo marcada'); }catch(x){ toast(x.code==='taken'?'Já tem aula individual nesse horário':'Erro ao marcar'); } };
  }
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('Cancelar esta aula em grupo?')) return; try{ await api('group-delete',{start:b.dataset.gdel}); await load(); toast('Aula cancelada'); }catch{ toast('Erro'); } });
  const mf=$('#mFile'); if(mf) mf.onchange=async()=>{ const file=mf.files[0]; if(!file) return;
    mf.value=''; const d=await cropPhoto(file); if(!d) return;
    try{ await api('mentor-photo',{photo:d}); await load(); toast('Foto salva'); }catch{ toast('Não deu para salvar essa foto'); } };
  const fa=$('#fAssign'); if(fa) fa.onsubmit=async e=>{ e.preventDefault(); const fd=new FormData(fa); const [y,mo,d]=String(fd.get('date')).split('-').map(Number), [h,mi]=String(fd.get('time')).split(':').map(Number);
    const dt=new Date(y,mo-1,d,h,mi); if(!(dt>new Date())){ toast('Escolha um horário futuro'); return; }
    try{ const r=await api('assign',{id:fd.get('id'),start:dt.toISOString()}); await load(); toast(`Aula marcada · Semana ${r.week}`); }catch(x){ toast(x.code==='taken'?'Esse horário já está ocupado':x.code==='done'?'Esse aluno já tem as 8 aulas':'Erro ao marcar'); } };
  const ft=$('#fTest'); if(ft) ft.onsubmit=async e=>{ e.preventDefault(); try{ const r=await api('test-class',{id:new FormData(ft).get('id')}); await load(); toast('Aula de teste marcada: '+fT(r.start)); }catch{ toast('Erro'); } };
  const fp=$('#fPost'); if(fp) fp.onsubmit=async e=>{ e.preventDefault(); try{ await api('post',Object.fromEntries(new FormData(fp))); await load(); toast('Publicado'); }catch{ toast('Erro'); } };
  document.querySelectorAll('[data-reply]').forEach(f=>f.onsubmit=async e=>{ e.preventDefault(); try{ await api('post',{thread:f.dataset.reply,body:new FormData(f).get('body')}); await load(); toast('Resposta publicada'); }catch{ toast('Erro'); } });
  document.querySelectorAll('[data-delt]').forEach(b=>b.onclick=async()=>{ if(!confirm('Apagar a conversa inteira?')) return; try{ await api('forum-delete',{thread:b.dataset.delt}); await load(); }catch{ toast('Erro'); } });
  document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=async()=>{ const [thread,reply]=b.dataset.delr.split('|'); try{ await api('forum-delete',{thread,reply}); await load(); }catch{ toast('Erro'); } });
}

$('#fL').onsubmit=async e=>{ e.preventDefault(); KEY=$('#k').value.trim(); try{ await load(); store.set('os_crm_key',KEY); $('#vLogin').hidden=true; $('#app').hidden=false; }catch{ $('#eL').hidden=false; } };
(async()=>{ if(KEY){ try{ await load(); $('#app').hidden=false; return; }catch{} } $('#vLogin').hidden=false; })();
/* ---------- ajustar foto (arrastar + zoom) ---------- */
function cropPhoto(file){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    im.onload = () => {
      const V = Math.min(300, innerWidth - 80), OUT = 360;
      const base = Math.max(V / im.naturalWidth, V / im.naturalHeight);
      let z = 1, x = 0, y = 0;
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(28,26,23,.55);display:flex;align-items:center;justify-content:center;padding:20px';
      wrap.innerHTML = `<div style="background:#F4F1EB;border-radius:22px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;color:#1C1A17">
        <p style="font-family:Fraunces,Tinos,serif;font-size:24px">Ajuste a sua foto</p>
        <p style="font-size:13.5px;color:#5F584F;text-align:center;margin-top:-8px">Arraste para posicionar e use o zoom.</p>
        <div data-v style="position:relative;width:${V}px;height:${V}px;overflow:hidden;border-radius:14px;background:#ECE6DD;touch-action:none;cursor:grab">
          <img data-i src="${url}" draggable="false" style="position:absolute;left:50%;top:50%;max-width:none;user-select:none;pointer-events:none">
          <div style="position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 9999px rgba(244,241,235,.72);outline:2px solid #fff;outline-offset:-2px"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;width:${V}px"><span style="font-size:13px;color:#857B6E">−</span><input data-z type="range" min="1" max="4" step="0.01" value="1" style="flex:1;accent-color:#A65E40"><span style="font-size:15px;color:#857B6E">+</span></div>
        <div style="display:flex;gap:10px"><button data-ok style="background:#A65E40;color:#fff;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:500">Usar esta foto</button><button data-no style="border:1px solid #D3CABD;border-radius:12px;padding:12px 18px;font-size:15px">Cancelar</button></div>
      </div>`;
      document.body.append(wrap);
      const v = wrap.querySelector('[data-v]'), pic = wrap.querySelector('[data-i]'), zr = wrap.querySelector('[data-z]');
      const clamp = () => { const s = base * z, w = im.naturalWidth * s, h = im.naturalHeight * s; const mx = (w - V) / 2, my = (h - V) / 2; x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y)); };
      const draw = () => { clamp(); const s = base * z; pic.style.width = im.naturalWidth * s + 'px'; pic.style.height = im.naturalHeight * s + 'px'; pic.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; };
      draw();
      const pts = new Map(); let last = null, pinch = null;
      v.addEventListener('pointerdown', e => { v.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; v.style.cursor = 'grabbing'; });
      v.addEventListener('pointermove', e => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) { z = Math.max(1, Math.min(4, z * d / pinch)); zr.value = z; } pinch = d; draw(); return; }
        if (last) { x += e.clientX - last[0]; y += e.clientY - last[1]; last = [e.clientX, e.clientY]; draw(); }
      });
      const up = e => { pts.delete(e.pointerId); pinch = null; last = pts.size ? [...pts.values()][0] : null; v.style.cursor = 'grab'; };
      v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
      v.addEventListener('wheel', e => { e.preventDefault(); z = Math.max(1, Math.min(4, z * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); zr.value = z; draw(); }, { passive: false });
      zr.oninput = () => { z = +zr.value; draw(); };
      const done = val => { URL.revokeObjectURL(url); wrap.remove(); resolve(val); };
      wrap.querySelector('[data-no]').onclick = () => done(null);
      wrap.querySelector('[data-ok]').onclick = () => {
        const s = base * z, c = document.createElement('canvas'); c.width = c.height = OUT;
        const sx = (im.naturalWidth * s / 2 - x - V / 2) / s, sy = (im.naturalHeight * s / 2 - y - V / 2) / s, sw = V / s;
        c.getContext('2d').drawImage(im, sx, sy, sw, sw, 0, 0, OUT, OUT);
        done(c.toDataURL('image/jpeg', .86));
      };
    };
    im.src = url;
  });
}
