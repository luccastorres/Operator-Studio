<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F1EC">
<link rel="icon" href="/favicon.png">
<title>Relatório da aula · Operator Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#151412;--linen:#F3F1EC;--linen2:#EAE6DF;--card:#FBFAF7;--line:#D9D3C9;--taupe:#7E7669;--soft:#5F594F;--sand:#B5AEA2;--gold:#C9A36A;--goldbg:#F4ECDD;
--serif:'Tinos','Times New Roman',serif;--sans:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--linen);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.logo{font-family:var(--serif);font-size:20px}.logo b{font-weight:700}.logo i{color:var(--taupe)}
.ey{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.h1{font-family:var(--serif);font-size:44px;line-height:1.02;letter-spacing:-.01em}.h1 em{font-weight:400;color:var(--taupe)}
.h2{font-family:var(--serif);font-size:24px;line-height:1.15}
.muted{color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--linen);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
header{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.hin{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
main{max-width:900px;margin:0 auto;padding:30px 18px 80px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.card>.ey{display:block;margin-bottom:12px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin-top:12px}
.chip{font-size:12px;border-radius:999px;padding:5px 11px;background:var(--linen2);color:var(--soft)}
.chip.ok{background:#E3EADF;color:#4E6B4F}
.lead{font-size:17px;line-height:1.65}
.q{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .n{font-family:var(--serif);font-size:28px;line-height:1;color:var(--sand)}
.q h3{font-size:16px;font-weight:600;line-height:1.4}
.q p{font-size:15px;line-height:1.6;color:var(--soft);margin-top:6px}
.q small{font-size:12px;color:var(--sand);letter-spacing:.06em}
ul.l{list-style:none;display:flex;flex-direction:column}
ul.l li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.55}
ul.l li:first-child{border-top:0;padding-top:0}
ul.l li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--taupe);margin-top:9px}
ul.t li::before{width:16px;height:16px;border-radius:5px;background:transparent;border:1.5px solid var(--taupe);margin-top:3px}
.next{background:var(--linen2);border-color:var(--linen2)}
.next p{font-family:var(--serif);font-size:24px;line-height:1.3}
.priv{background:var(--goldbg);border-color:#E6D7BC}
.priv .ey{color:#8A6A3A}
.priv ul.l li{border-color:#E6D7BC}
.priv ul.l li::before{background:var(--gold)}
.two{display:grid;gap:16px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.tr{max-height:70vh;overflow-y:auto}
.p{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.6}
.p:first-child{border-top:0}
.p b{font-size:12px;letter-spacing:.04em}.p b.m{color:var(--taupe)}
.p small{color:var(--sand);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}
.p mark{background:#F1E2C4;border-radius:3px}
.in{width:100%;background:var(--linen);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;margin-bottom:10px}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;max-width:520px}
.dots{display:inline-flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--taupe);animation:d 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.2}40%{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--linen);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:640px){.h1{font-size:36px}}
@media print{
  header,.noprint,.toast{display:none!important}
  html,body{background:#fff}
  main{padding:0;gap:12px;max-width:none}
  .card{break-inside:avoid;border-color:#DDD8CF}
  .priv{display:none!important}
  .tr{max-height:none;overflow:visible}
  @page{margin:16mm}
}
</style>
</head>
<body>
<header><div class="hin"><span class="logo"><b>Operator</b> <i>Studio</i></span>
  <div class="row noprint"><a class="btn ghost" href="/hub/admin/#aulas">Painel</a></div></div></header>
<main id="main"><div class="center"><div class="dots"><i></i><i></i><i></i></div><p class="muted">Carregando…</p></div></main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch{return null}}};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const Q = new URLSearchParams(location.search), START = Q.get('s')||'', KEY = ls.get('os_crm_key')||'';
let D = null, pollT = null, fallbackDone = false, firstSeen = Date.now(), FILTER = '';

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
async function api(path, body){
  const r = await fetch('/api/live/'+path+(body?'':(path.includes('?')?'&':'?')+'s='+encodeURIComponent(START)),{method:body?'POST':'GET',headers:{'x-crm-key':KEY,'content-type':'application/json'},body:body?JSON.stringify({start:START,...body}):undefined,cache:'no-store'});
  const j = await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(j.error||'api'); e.status=r.status; throw e; } return j;
}
const fDT = iso => new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
const first = n => String(n||'').trim().split(/\s+/)[0];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

async function load(){
  if(!KEY){ $('#main').innerHTML = `<div class="center"><h1 class="h1">Faça <em>login.</em></h1><p class="muted">Entre no painel do mentor e abra o relatório pela aba Aulas.</p><a class="btn" href="/hub/admin/">Painel do mentor</a></div>`; return; }
  try{ D = await api('report'); }
  catch(e){ $('#main').innerHTML = `<div class="center"><h1 class="h1">Relatório <em>não encontrado.</em></h1><p class="muted">${e.status===401?'Sua sessão expirou: entre de novo no painel.':'Não há dados para esta aula.'}</p><a class="btn" href="/hub/admin/#aulas">Voltar ao painel</a></div>`; return; }
  render();
  const st = D.report?.status;
  if(st==='pending' || (Q.get('wait') && !st)){
    clearTimeout(pollT); pollT = setTimeout(load, 5000);
    const pendingFor = Date.now() - Math.min(firstSeen, new Date(D.report?.updatedAt||Date.now()).getTime());
    if(!fallbackDone && pendingFor > 120000){ fallbackDone = true; generate(true); }
  }
}

function head(){
  const s = D.student || {}, r = D.report || {}, slot = D.slot || {};
  const start = r.start || slot.start || START, week = r.week || slot.week;
  return `<div><span class="ey">Relatório da aula · Semana ${esc(week||'')}</span>
    <h1 class="h1" style="margin-top:10px">${esc(first(s.nome)||'Aluno')}<em>${s.negocio?', '+esc(s.negocio):''}.</em></h1>
    <div class="meta"><span>${esc(cap(fDT(start)))}</span>${(r.minutes||D.transcript?.minutes)?`<span>${r.minutes||D.transcript.minutes} min transcritos</span>`:''}${r.status==='done'?(r.shared?'<span class="chip ok">Publicado para o aluno</span>':'<span class="chip">Só você vê</span>'):''}</div></div>`;
}

function render(){
  const r = D.report, st = r?.status;
  let html = head();
  if(!r || st==='pending'){
    html += `<div class="card"><div class="row" style="gap:14px"><div class="dots"><i></i><i></i><i></i></div><div><p class="h2">${r?'Gerando o relatório…':'Aula sem relatório ainda.'}</p><p class="muted" style="margin-top:4px;font-size:14px">${r?'Lendo a transcrição. Esta página atualiza sozinha.':'Encerre a aula pela sala ou gere o relatório com a transcrição que já chegou.'}</p></div></div>
      ${r?'':`<div class="row" style="margin-top:14px"><button class="btn" id="gen">Gerar relatório agora</button></div>`}</div>`;
  } else if(st==='error'){
    html += `<div class="card"><p class="h2">O relatório não foi gerado.</p><p class="muted" style="margin-top:6px;font-size:14px">${esc(r.error||'Erro desconhecido')}</p><div class="row" style="margin-top:14px"><button class="btn" id="gen">Tentar de novo</button></div></div>`;
  } else if(st==='empty'){
    html += `<div class="card"><p class="h2">Quase nada foi transcrito.</p><p class="muted" style="margin-top:6px;font-size:14px;line-height:1.5">A transcrição recebeu poucas falas desta aula. Verifique se a transcrição estava ativa (o selo "Transcrevendo" no topo da sala) e se a chave da Daily está configurada.</p><div class="row" style="margin-top:14px"><button class="btn ghost" id="gen">Gerar de novo</button></div></div>`;
  } else {
    const x = r.report || {};
    html += `<div class="row noprint">
        <button class="btn" id="share">${r.shared?'Ocultar do aluno':'Publicar para o aluno'}</button>
        <button class="btn ghost" id="wa">Copiar para WhatsApp</button>
        <button class="btn ghost" onclick="print()">Salvar PDF</button>
        <button class="btn ghost" id="gen">Gerar de novo</button></div>
      <div class="card"><span class="ey">Resumo</span><p class="lead">${esc(x.resumo||'')}</p></div>
      <div class="card"><span class="ey">Perguntas de ${esc(first(D.student?.nome)||'aluno')} · ${(x.perguntas||[]).length}</span>
        ${(x.perguntas||[]).length ? x.perguntas.map((q,i)=>`<div class="q"><span class="n">${String(i+1).padStart(2,'0')}</span><div><small>${esc(q.momento||'')}</small><h3>${esc(q.pergunta)}</h3><p>${esc(q.resposta||'')}</p></div></div>`).join('') : '<p class="muted">Nenhuma pergunta registrada.</p>'}</div>
      <div class="two">
        <div class="card"><span class="ey">O que construímos</span>${list(x.construido)}</div>
        <div class="card"><span class="ey">Tarefas até a próxima sessão</span>${list((x.tarefas||[]).map(t=>t.tarefa+(t.prazo?` · ${t.prazo}`:'')),'t')}</div>
      </div>
      <div class="card next"><span class="ey">Próximo passo</span><p>${esc(x.proximo_passo||'')}</p></div>
      <div class="card priv"><span class="ey">Só para você · o aluno nunca vê esta parte</span>
        <p style="font-size:15px;margin-bottom:12px"><b>Engajamento ${esc(x.engajamento||'')}</b>${x.engajamento_nota?` · <span class="muted">${esc(x.engajamento_nota)}</span>`:''}</p>
        ${(x.pontos_atencao||[]).length?`<p class="ey" style="margin:14px 0 8px">Pontos de atenção</p>${list(x.pontos_atencao)}`:''}
        ${(x.ideias_mentor||[]).length?`<p class="ey" style="margin:16px 0 8px">Oportunidades</p>${list(x.ideias_mentor)}`:''}
      </div>`;
  }
  const tr = D.transcript;
  if(tr?.paras?.length){
    html += `<div class="card noprint"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="ey" style="margin:0">Transcrição completa${tr.live?' · ao vivo':''}</span><span class="muted" style="font-size:13px">${tr.paras.length} trechos</span></div>
      <input class="in" id="q" placeholder="Buscar na transcrição…" value="${esc(FILTER)}"><div class="tr" id="tr">${paras(tr.paras)}</div></div>`;
  }
  $('#main').innerHTML = html;
  bind();
}
function list(a, cls){ a = (a||[]).filter(Boolean); return a.length ? `<ul class="l ${cls||''}">${a.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul>` : '<p class="muted" style="font-size:14px">Nada registrado.</p>'; }
function paras(ps){
  const f = FILTER.trim().toLowerCase();
  const out = ps.filter(p=>!f || p.text.toLowerCase().includes(f) || p.who.toLowerCase().includes(f));
  const hl = t => { const e=esc(t); if(!f) return e; const re=new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); return e.replace(re,m=>`<mark>${m}</mark>`); };
  return out.length ? out.map(p=>`<div class="p"><small>${esc(p.at)}</small><b class="${p.role==='mentor'?'m':''}">${esc(p.who)}</b><br>${hl(p.text)}</div>`).join('') : '<p class="muted" style="font-size:14px">Nada encontrado.</p>';
}
function waText(){
  const x = D.report.report, n = first(D.student?.nome);
  return [`*Resumo da nossa aula · Semana ${D.report.week||''}*`, '', x.resumo, '',
    (x.perguntas||[]).length?'*Suas perguntas*':'', ...(x.perguntas||[]).map((q,i)=>`${i+1}. ${q.pergunta}\n   → ${q.resposta}`), '',
    (x.tarefas||[]).length?'*Tarefas até a próxima sessão*':'', ...(x.tarefas||[]).map(t=>`☐ ${t.tarefa}${t.prazo?` (${t.prazo})`:''}`), '',
    `*Próximo passo:* ${x.proximo_passo||''}`, '', `Tudo fica salvo no seu Student Hub. Bom trabalho, ${n}!`].filter((l,i,a)=>!(l===''&&a[i-1]==='')).join('\n');
}
function bind(){
  const g=$('#gen'); if(g) g.onclick=()=>generate(false);
  const s=$('#share'); if(s) s.onclick=async()=>{ try{ const r=await api('share',{shared:!D.report.shared}); D.report.shared=r.shared; render(); toast(r.shared?'Publicado no Student Hub do aluno':'Oculto do aluno'); }catch{ toast('Erro'); } };
  const w=$('#wa'); if(w) w.onclick=async()=>{ try{ await navigator.clipboard.writeText(waText()); toast('Resumo copiado'); }catch{ prompt('Copie o texto:', waText()); } };
  const q=$('#q'); if(q) q.oninput=()=>{ FILTER=q.value; $('#tr').innerHTML=paras(D.transcript.paras); };
}
async function generate(silent){
  if(!silent){ D.report = { ...(D.report||{}), status:'pending', updatedAt:new Date().toISOString() }; firstSeen = Date.now(); fallbackDone = false; render(); }
  try{
    if(silent){ await api('generate',{}); }
    else { await api('end',{}); await fetch('/api/live-report',{method:'POST',headers:{'x-crm-key':KEY,'content-type':'application/json'},body:JSON.stringify({start:START})}); }
  }catch{}
  clearTimeout(pollT); pollT = setTimeout(load, silent?500:5000);
}
load();
</script>
</body>
</html>
