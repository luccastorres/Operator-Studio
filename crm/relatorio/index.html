<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Diagnóstico Operator Studio</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#151412;--linen:#F3F1EC;--linen2:#EAE6DF;--card:#FBFAF7;--line:#D9D3C9;--taupe:#7E7669;--soft:#5F594F;--sand:#B5AEA2;--gold:#C9A36A;
--serif:'Tinos','Times New Roman',serif;--sans:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:#E4E0D8;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:rgba(243,241,236,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.bar span{font-size:14px;color:var(--soft)}
.btn{background:var(--ink);color:var(--linen);border:0;border-radius:999px;padding:11px 18px;font:500 15px var(--sans);cursor:pointer;text-decoration:none}
.msg{max-width:420px;margin:80px auto;padding:0 20px;font-size:17px;line-height:1.5;color:var(--soft)}
.msg a{color:var(--ink)}
.pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 12px 60px}
.page{width:210mm;min-height:297mm;background:var(--linen);padding:16mm 16mm 14mm;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(21,20,18,.35)}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
.logo{font-family:var(--serif);font-size:15pt;letter-spacing:0;text-transform:none;color:var(--ink)}.logo b{font-weight:700}.logo i{color:var(--taupe)}
.pf{margin-top:auto;padding-top:5mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--taupe)}
.eyebrow{font-size:8.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe)}
h1{font-family:var(--serif);font-weight:700;font-size:44pt;line-height:.98;letter-spacing:-.01em;margin:22mm 0 6mm}
h1 em,h2 em{font-weight:400;color:var(--taupe)}
h2{font-family:var(--serif);font-weight:700;font-size:24pt;line-height:1.05;margin:3mm 0 6mm}
.who{display:flex;gap:10mm;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4mm 0;margin-bottom:10mm}
.who div span{display:block;font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin-bottom:1mm}
.who div b{font-weight:500;font-size:11pt}
.score{display:grid;grid-template-columns:52mm 1fr;gap:10mm;align-items:start;margin-bottom:10mm}
.big{background:var(--card);border:1px solid var(--line);border-radius:5mm;padding:7mm 6mm}
.big b{font-family:var(--serif);font-size:48pt;line-height:1}
.big b small{font-size:18pt;color:var(--sand)}
.big p{font-family:var(--serif);font-style:italic;font-size:15pt;color:var(--taupe);margin-top:2mm}
.big .scale{display:flex;gap:1.2mm;margin-top:5mm}
.big .scale i{flex:1;height:1.6mm;border-radius:1mm;background:var(--line)}
.big .scale i.on{background:var(--ink)}
.dims{display:flex;flex-direction:column;gap:4.2mm}
.dim .t{display:flex;justify-content:space-between;font-size:10.5pt;margin-bottom:1.6mm}
.dim .t span:last-child{color:var(--soft)}
.dim .r{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2mm}
.dim .r i{height:3mm;border-radius:1mm;background:var(--linen2);border:1px solid var(--line)}
.dim .r i.on{background:var(--taupe);border-color:var(--taupe)}
.dim.low .r i.on{background:var(--ink);border-color:var(--ink)}
.dim.low .t span:first-child::after{content:'  · maior oportunidade';color:var(--taupe);font-size:9pt}
.read{font-size:11.5pt;line-height:1.55;color:var(--soft);max-width:150mm}
.quote{background:var(--card);border:1px solid var(--line);border-radius:5mm;padding:7mm;margin-top:8mm}
.quote p{font-family:var(--serif);font-style:italic;font-size:16pt;line-height:1.35;margin-top:2mm}
.ops{display:flex;flex-direction:column;gap:4mm}
.op{background:var(--card);border:1px solid var(--line);border-radius:5mm;padding:4.5mm 6mm;display:grid;grid-template-columns:10mm 1fr 34mm 34mm;gap:5mm;align-items:center}
.op .n{font-family:var(--serif);font-size:20pt;color:var(--taupe)}
.op h3{font-size:13pt;font-weight:600;line-height:1.25}
.op .fr{font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-top:1.5mm}
.op .m{text-align:right}
.op .m b{display:block;font-family:var(--serif);font-size:17pt;line-height:1.1}
.op .m span{font-size:8.5pt;color:var(--soft)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:5mm}
.tot div{border-radius:5mm;padding:5mm 6mm;background:var(--linen2)}
.tot div.k{background:var(--ink);color:var(--linen)}
.tot b{display:block;font-family:var(--serif);font-size:24pt;line-height:1.05}
.tot span{font-size:9pt;opacity:.8}
.fine{font-size:8.5pt;color:var(--taupe);margin-top:3mm;line-height:1.45}
.next{display:grid;grid-template-columns:1fr 72mm;gap:8mm;margin-top:3mm;align-items:start}
.next .rec{font-size:12pt;line-height:1.55}
.offer{background:var(--card);border:1px solid var(--line);border-radius:5mm;padding:6mm}
.offer p.t{font-family:var(--serif);font-size:15pt;margin-bottom:3mm}.offer p.t i{color:var(--taupe)}
.offer li{list-style:none;font-size:10pt;padding:1.8mm 0;border-top:1px solid var(--line)}
.offer li:first-child{border-top:0}
.cta{white-space:nowrap;margin-top:4mm;background:var(--ink);color:var(--linen);border-radius:999px;padding:3mm 5mm;text-align:center;font-size:10pt;font-weight:500}
@page{size:A4;margin:0}
@media print{
  html,body{background:var(--linen)}
  .bar{display:none}
  .pages{padding:0;gap:0}
  .page{box-shadow:none;break-after:page;height:297mm;overflow:hidden}
}
@media screen and (max-width:820px){
  .pages{zoom:.46}
}
</style>
</head>
<body>
<div class="bar"><span id="bt">Diagnóstico</span><button class="btn" onclick="window.print()">Salvar PDF</button></div>
<p class="msg" id="msg" hidden></p>
<div class="pages" id="pages"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIMS = [['at','Atendimento'],['ag','Agenda e vendas'],['org','Organização'],['aut','Automação'],['pre','Presença e conteúdo']];
const LEVELS = [
  [10,'Manual','Quase tudo hoje depende de você. É exatamente aqui que a IA devolve mais tempo, e mais rápido.'],
  [17,'Em organização','Já existe uma base, mas muita coisa ainda passa pela sua mão. Organizar e automatizar o essencial muda a sua semana.'],
  [22,'Estruturado','A operação está organizada. O próximo ganho vem de automatizar o que se repete e escalar com IA.'],
  [25,'Operado com IA','Seu negócio já opera com IA. O foco agora é refinar os sistemas e crescer.']
];
const fmt = n => Math.round(n).toLocaleString('pt-BR');
function key(){ try{ return localStorage.getItem('os_crm_key')||''; }catch{ return ''; } }
function msg(h){ $('#msg').innerHTML = h; $('#msg').hidden = false; }

(async()=>{
  const id = new URLSearchParams(location.search).get('id');
  const k = key();
  if(!k) return msg('Entre no <a href="/crm/">CRM</a> primeiro, depois abra o relatório pela ficha do lead.');
  let d; try{ const r = await fetch('/api/crm',{headers:{'x-crm-key':k},cache:'no-store'}); if(!r.ok) throw 0; d = await r.json(); }catch{ return msg('Não foi possível carregar. Entre no <a href="/crm/">CRM</a> e tente de novo.'); }
  const l = d.leads.find(x=>x.id===id);
  if(!l || !l.diag) return msg('Este lead ainda não tem ficha de diagnóstico. Preencha a ficha no <a href="/crm/">CRM</a>.');
  render(l);
})();

function render(l){
  const g = l.diag, f = l.form||{}, s = g.scores||{};
  const total = DIMS.reduce((a,[k])=>a+(+s[k]||0),0);
  const lv = LEVELS.find(x=>total<=x[0]) || LEVELS[3];
  const min = Math.min(...DIMS.map(([k])=>+s[k]||0));
  const ops = (g.ops||[]).filter(o=>o.processo);
  const rows = ops.map(o=>{ const hm = (+o.horas||0)*(+o.pct||0)/100*4.33; return {...o, hm, eur: hm*(+g.valorHora||0)}; });
  const hm = rows.reduce((a,r)=>a+r.hm,0), eur = rows.reduce((a,r)=>a+r.eur,0);
  const negocio = l.negocio || f.negocio || '';
  const date = new Date(g.updatedAt||Date.now()).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const first = String(l.nome||'').trim().split(/\s+/)[0];
  document.title = `Diagnóstico Operator · ${l.nome}`;
  $('#bt').textContent = `${l.nome}${negocio?' · '+negocio:''}`;
  const head = n => `<div class="ph"><span class="logo"><b>Operator</b> <i>Studio</i></span><span>Diagnóstico · ${n}/2</span></div>`;
  const foot = `<div class="pf"><span>Confidencial · preparado para ${esc(l.nome)}</span><span>@luccastorres</span></div>`;

  $('#pages').innerHTML = `
  <section class="page">
    ${head(1)}
    <h1>Diagnóstico<br><em>do seu negócio.</em></h1>
    <div class="who">
      <div><span>Para</span><b>${esc(l.nome)}</b></div>
      ${negocio?`<div><span>Negócio</span><b>${esc(negocio)}</b></div>`:''}
      <div><span>Data</span><b>${esc(date)}</b></div>
    </div>
    <span class="eyebrow">Maturidade operacional</span>
    <h2>Onde o seu negócio <em>está hoje.</em></h2>
    <div class="score">
      <div class="big"><b>${total}<small>/25</small></b><p>${lv[1]}</p><div class="scale">${LEVELS.map(x=>`<i class="${x===lv?'on':''}"></i>`).join('')}</div></div>
      <div class="dims">${DIMS.map(([k,t])=>{ const v = +s[k]||0; return `<div class="dim ${v===min?'low':''}"><div class="t"><span>${t}</span><span>${v}/5</span></div><div class="r">${[1,2,3,4,5].map(n=>`<i class="${n<=v?'on':''}"></i>`).join('')}</div></div>`; }).join('')}</div>
    </div>
    <p class="read">${esc(lv[2])}</p>
    ${g.dor?`<div class="quote"><span class="eyebrow">A dor principal</span><p>“${esc(g.dor)}”</p></div>`:''}
    ${foot}
  </section>
  <section class="page">
    ${head(2)}
    <span class="eyebrow" style="margin-top:9mm">Prioridades</span>
    <h2>Três processos para tirar <em>das suas mãos.</em></h2>
    <div class="ops">${rows.map((r,i)=>`<div class="op"><span class="n">${i+1}</span><div><h3>${esc(r.processo)}</h3>${r.frente?`<p class="fr">${esc(r.frente)}</p>`:''}</div>
      <div class="m"><b>${fmt(r.hm)} h</b><span>por mês de volta</span></div><div class="m"><b>€ ${fmt(r.eur)}</b><span>por mês</span></div></div>`).join('') || '<p class="read">Processos a definir.</p>'}</div>
    <div class="tot">
      <div><b>${fmt(hm)} h</b><span>recuperáveis por mês</span></div>
      <div><b>${fmt(hm/8)} dias</b><span>de trabalho por mês</span></div>
      <div class="k"><b>€ ${fmt(eur)}</b><span>em tempo por mês</span></div>
    </div>
    <p class="fine">Estimativa feita na análise, com base nas horas informadas, na parte de cada tarefa que pode ser automatizada e no valor de € ${fmt(+g.valorHora||0)} por hora. Não é garantia de resultado.</p>
    <span class="eyebrow" style="margin-top:7mm">Próximo passo</span>
    <div class="next">
      <div class="rec">${esc(g.proximo || `Começar pelo processo 1, que devolve mais tempo com menos esforço, e construir os outros em sequência.`)}</div>
      <div class="offer"><p class="t"><b>Mentoria</b> <i>individual</i></p><ul>
        <li>8 semanas, online e ao vivo</li><li>Plano personalizado para ${esc(first||'você')}</li><li>Os sistemas funcionando no seu negócio</li><li>Você aprende a criar os próximos</li></ul>
        <p class="cta">Fale comigo · @luccastorres</p></div>
    </div>
    ${foot}
  </section>`;
}
</script>
</body>
</html>
